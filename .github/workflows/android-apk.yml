name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build installable APK
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain -x lintVitalAnalyzeRelease -x lintVitalRelease
      - name: Check APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" android/app/build/outputs/apk/release/app-release.apk \
            --title "Android APK #${GITHUB_RUN_NUMBER}" \
            --notes "Установочная тестовая сборка. Обновление загружается из GitHub Releases и подтверждается пользователем в Android." \
            --prerelease
